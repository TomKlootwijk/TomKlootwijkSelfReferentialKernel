<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Kernel conformance</title><link rel="stylesheet" href="../dist/style.css"></head><body><main><h1>Kernel conformance</h1><button id="test">Test WebGPU ↔ native CUDA</button><pre id="result">Ready</pre><script type="module">
import{DEFAULT,Tape,packBits,canonical,need,pairHex}from'../dist/core.js';import{Machine}from'../dist/machine.js';import{GPUKernel}from'../dist/gpu.js';import{PeerSession}from'../dist/peer.js';
const result=document.getElementById('result');
document.getElementById('test').onclick=async()=>{let session;try{
 const gpu=await GPUKernel.create();result.textContent='GPU: '+JSON.stringify(gpu.info);let commits=0;
 session=new PeerSession(new Machine(),gpu,()=>commits++,status=>{result.textContent+='\n'+status;});
 const offer=await session.offer([]),response=await fetch('/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(offer)});need(response.ok,'Native bridge rejected offer');await session.accept(await response.json());
 const wait=async test=>{const deadline=performance.now()+15000;while(!test()){need(performance.now()<deadline,'Peer timed out');need(!session.rounds.failed,session.rounds.failed);await new Promise(r=>setTimeout(r,20));}};await wait(()=>session.ready);
 const stage=async event=>{const before=session.rounds.round;await session.stage(event);await wait(()=>session.rounds.round===before+1);await wait(()=>session.receipts.size===0);const peer=await(await fetch('/result')).json();need(!peer.error&&peer.round===session.rounds.round&&canonical(peer.checkpoint)===canonical(session.machine.checkpoint()),'Native/WebGPU checkpoint mismatch');};
 await stage({kind:'step',...packBits(Array.from({length:128},(_,i)=>i%2))});need(pairHex(session.machine.kernel.word)==='11020439010204C7','Default retained pair differs');
 await stage({kind:'genes',genes:{role:'pinion',turns:[255,0,37],gains:[4,-3,0,2,-1,1,3,-4]}});
 await stage({kind:'step',...packBits(Array.from({length:32},(_,i)=>i%3===0?1:0))});
 await stage({kind:'genes',genes:{role:'tape',...new Tape().snapshot()}});await stage({kind:'step',...packBits(Array(8).fill(0))});need(session.machine.kernel.status==='HALT','Tape did not halt');
 await stage({kind:'genes',genes:{role:'pinion',...DEFAULT}});await stage({kind:'step',...packBits(Array.from({length:128},(_,i)=>i%2))});
 result.textContent+='\nPASS · '+commits+' rounds · native CUDA ↔ browser WebGPU · genes and role changes · identical checkpoints';
 await fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result:'PASS',browserAdapter:gpu.info,rounds:commits,checkpoint:session.machine.checkpoint()})});
}catch(e){result.textContent+='\nFAIL: '+e.message;}finally{session?.close();}};
</script></main></body></html>
